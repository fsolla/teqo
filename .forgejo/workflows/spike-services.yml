name: Spike — service postgres em porta própria

on:
  push:
    branches: [OPS50-spike-services]

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teqo
          POSTGRES_PASSWORD: teqo
          POSTGRES_DB: teqo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U teqo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Probe TCP localhost:5433
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/localhost/5433) 2>/dev/null; then
              echo "CONNECTED to localhost:5433"
              exit 0
            fi
            sleep 2
          done
          echo "FAILED to reach localhost:5433"
          exit 1
